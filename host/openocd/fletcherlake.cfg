# Fletcher Lake FPGA programming (OpenOCD 0.12).  Static: the host adds
#   -c "adapter serial <id>"   (optional, for Macs with several cables)
#   -c "init; pld load 0 {<bitstream>}; shutdown"
# so this file must not call init or pld load itself.

# STANDIN(jtag-adapter): replace with the interface section of the cfg supplied
# by the hardware team.  Digilent HS3 is a guess at the cable in use.
source [find interface/ftdi/digilent_jtag_hs3.cfg]
adapter speed 10000
transport select jtag

# Kintex-7 XC7K160T (fpga-shells board.tcl: xc7k160tfbg676-2L).  IDCODE from UG470.
jtag newtap xc7 tap -irlen 6 -ignore-version -expected-id 0x0364c093

# 7-series needs no JSTART after configuration (trailing 1 = no_jstart).
pld device virtex2 xc7.tap 1
